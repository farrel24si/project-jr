<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background Gradient: Hospital Room Ambience -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Medical Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.05" />
    </linearGradient>

    <!-- Accent Glow -->
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#145DA0" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0A3981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <circle cx="400" cy="260" r="320" fill="url(#glow)" />

  <!-- Grid lines (Camera Viewfinder effect) -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="266" y1="0" x2="266" y2="600" />
    <line x1="533" y1="0" x2="533" y2="600" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Center Illustration: Hospital Care & Verification -->
  <g transform="translate(400, 240)">
    <!-- Hospital Bed & Medical Cross Backdrop -->
    <circle cx="0" cy="0" r="90" fill="#0A3981" fill-opacity="0.4" stroke="#145DA0" stroke-width="2" stroke-dasharray="4 4" />
    
    <!-- Medical Shield Icon -->
    <path d="M0 -55 L45 -35 V10 C45 42 18 68 0 78 C-18 68 -45 42 -45 10 V-35 Z" fill="#0A3981" stroke="#38bdf8" stroke-width="3" />
    
    <!-- Medical Cross -->
    <path d="M-8 -22 H8 V-6 H24 V10 H8 V26 H-8 V10 H-24 V-6 H-8 Z" fill="#ffffff" />
    
    <!-- Verified Checkmark Badge -->
    <circle cx="28" cy="22" r="16" fill="#10b981" stroke="#022c22" stroke-width="2" />
    <path d="M22 22 L26 26 L34 18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Text Title & Status in Center -->
  <text x="400" y="370" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="0.5">
    DOKUMENTASI KUNJUNGAN RUMAH SAKIT
  </text>
  <text x="400" y="395" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
    PT Jasa Raharja • Bukti Fisik Lapangan Mobile Service
  </text>

  <!-- Viewfinder Corner Brackets -->
  <g stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.8">
    <!-- Top Left -->
    <path d="M 40 85 L 40 55 L 70 55" />
    <!-- Top Right -->
    <path d="M 760 85 L 760 55 L 730 55" />
    <!-- Bottom Left -->
    <path d="M 40 475 L 40 505 L 70 505" />
    <!-- Bottom Right -->
    <path d="M 760 475 L 760 505 L 730 505" />
  </g>

  <!-- TOP OVERLAY: Header Bar -->
  <rect x="0" y="0" width="800" height="50" fill="#000000" fill-opacity="0.85" />
  <line x1="0" y1="50" x2="800" y2="50" stroke="#145DA0" stroke-width="2" />

  <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#38bdf8" letter-spacing="1">
    PT JASA RAHARJA (PERSERO)
  </text>
  <text x="24" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ffffff">
    SISTEM MONITORING KINERJA • BUKTI LAPANGAN RESMI
  </text>

  <g transform="translate(680, 16)">
    <rect x="0" y="0" width="96" height="22" rx="4" fill="#047857" />
    <circle cx="12" cy="11" r="4" fill="#34d399" />
    <text x="22" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff">
      TERVERIFIKASI
    </text>
  </g>

  <!-- BOTTOM OVERLAY: Watermark Metadata Bar -->
  <rect x="0" y="515" width="800" height="85" fill="#000000" fill-opacity="0.92" />
  <line x1="0" y1="515" x2="800" y2="515" stroke="#145DA0" stroke-width="2" />

  <text x="24" y="538" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#ffffff">
    PT JASA RAHARJA • DOKUMENTASI MONITORING KORBAN
  </text>

  <text x="24" y="558" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">
    Petugas: Mobile Service Officer | Status: Terverifikasi di Faskes
  </text>
  <text x="24" y="574" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">
    Lokasi Kunjungan: Ruang Perawatan / RS Rujukan Kerjasama Jasa Raharja
  </text>
  <text x="24" y="590" font-family="system-ui, 'Courier New', monospace" font-size="11" font-weight="700" fill="#4ade80">
    Titik GPS: 0.528350, 101.448550 (Akurasi: ±6m) • Waktu Valid Terenkripsi
  </text>
</svg>

